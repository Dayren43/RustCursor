name: Label check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

jobs:
  check:
    name: Require bump label
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one of patch / minor / major
        shell: bash
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          COUNT=0
          echo "$LABELS" | grep -q '"patch"' && COUNT=$((COUNT + 1))
          echo "$LABELS" | grep -q '"minor"' && COUNT=$((COUNT + 1))
          echo "$LABELS" | grep -q '"major"' && COUNT=$((COUNT + 1))
          if [[ $COUNT -eq 0 ]]; then
            echo "ERROR: PRs targeting main must have one of the labels: patch, minor, major"
            exit 1
          elif [[ $COUNT -gt 1 ]]; then
            echo "ERROR: Multiple bump labels found. Use exactly one of: patch, minor, major"
            exit 1
          fi
          echo "OK"
