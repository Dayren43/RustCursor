[package]
name = "rust_cursor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "RustCursor"
path = "src/main.rs"

[dependencies]
interception = "0.1.2"
tray-icon = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
version = ">=0.59, <=0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
]
