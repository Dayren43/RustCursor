[package]
name = "rust_cursor"
version = "0.3.1"
edition = "2024"

[[bin]]
name = "RustCursor"
path = "src/main.rs"

[features]
default = ["log"]
# Enables the `cursor_log.txt` tail under %LOCALAPPDATA%\RustCursor. Disabled in
# release builds (`--no-default-features`) to drop the file I/O and basename
# resolution on the input-event hot path entirely.
log = []
# Enables the Interception kernel-driver backend. Requires the Interception
# driver and DLL to be present. Omitted from release builds so the bare exe
# runs on lowlevel without needing interception.dll.
interception-backend = ["dep:interception"]

[dependencies]
interception = { version = "0.1.2", optional = true }
tray-icon = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
indoc = "2"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }

[dependencies.windows]
version = ">=0.59, <=0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
]
